[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-uploader"
version = "0.4.0"
description = "Local, agent-driven YouTube uploader for owner-selected channels"
requires-python = ">=3.13,<3.15"
dependencies = [
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "requests",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
yt-upload = "yt_uploader.cli:main"
kt404-youtube = "yt_uploader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
