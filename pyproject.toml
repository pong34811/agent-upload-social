[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "katy404-youtube-agent"
version = "0.2.0"
description = "Local YouTube batch uploader for the Katy404 channel"
requires-python = ">=3.13,<3.15"
dependencies = [
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "keyring",
    "requests",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
kt404-youtube = "katy404_youtube_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
